<ul class="row g-4 list-unstyled my-5">
	@for (user of iUsers?.results; track user._id) {
		<li class="col-12 col-xs-6 col-md-4 col-xl-3">
			<app-card-user [user]="user" />
		</li>
	}
</ul>

@if (iUsers?.results?.length == 0) {
	<p class="mb-4 text-center h6 fw-normal">Parece que no hay usuarios en la base de datos para la url que quieres visitar 🧐</p>
} @else {
	<app-pagination-buttons [page]="iUsers?.page ?? 1" [totalPages]="iUsers?.total_pages ?? 1" />
}
